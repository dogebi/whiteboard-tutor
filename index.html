<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whiteboard Tutor — What do you want to understand?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Patrick+Hand&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --paper:#fdfcf9; --ink:#33312d; --ink2:#6e685c; --ink3:#a29c90;
  --line:#dcd7ca; --accent:#217a3c; --red:#cf4a3f; --blue:#3f62c9;
  --shadow:0 18px 44px rgba(55,50,40,.20), 0 3px 10px rgba(55,50,40,.12);
}
*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; background:#d6d0c2; color:var(--ink);
  font-family:'Patrick Hand','Kalam',cursive;
  display:flex; align-items:center; justify-content:center; padding:1.1vh;
}
#app{
  width:min(98vw,1680px); height:min(96vh,980px);
  background:linear-gradient(150deg,#fff 0%,#faf9f5 42%,#f2f0ea 100%);
  border-radius:20px; box-shadow:var(--shadow);
  display:grid; grid-template-columns:minmax(340px,4fr) minmax(420px,7fr);
  overflow:hidden; position:relative;
}
/* ---------- 왼쪽: 텍스트 ---------- */
#left{
  padding:24px 24px 72px; overflow-y:auto; border-right:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(250,249,245,0) 40%);
}
#brand{ display:flex; align-items:baseline; gap:8px; margin-bottom:12px; }
#brand b{ font-family:'Gochi Hand',cursive; font-weight:400; font-size:18px; }
#brand span{ font-size:12px; color:var(--ink3); }
#q{ font-family:'Gochi Hand',cursive; font-size:clamp(21px,2vw,30px); line-height:1.24; margin:0 0 3px; }
#qsub{ font-size:13.5px; color:var(--ink3); margin:0 0 16px; }
#steps{ display:flex; flex-direction:column; gap:11px; }
.card{
  border:1px solid var(--line); border-left:3px solid transparent; border-radius:10px;
  padding:10px 12px; background:rgba(255,255,255,.62); cursor:pointer;
  transition:border-color .18s,background .18s,transform .12s,opacity .25s;
}
.card:hover{ background:#fff; transform:translateX(1px); }
.card.active{ border-left-color:var(--accent); background:#fff; box-shadow:0 4px 14px rgba(50,45,35,.08); }
.card.dim{ opacity:.5; }
.card .idx{ font-size:11.5px; color:var(--ink3); letter-spacing:.07em; }
.card h3{ font-family:'Gochi Hand',cursive; font-weight:400; font-size:18.5px; margin:2px 0 4px; }
.card p{ margin:2px 0; font-size:15.5px; line-height:1.42; color:#443f37; min-height:1px; }
.card p.k{ color:var(--red); }
.card p.g{ color:var(--accent); }
#newQ{ position:absolute; left:22px; bottom:16px; font-size:13px; color:var(--ink3);
  cursor:pointer; border-bottom:1px dotted var(--ink3); }
#newQ:hover{ color:var(--ink); }
/* ---------- 오른쪽: 인터랙티브 ---------- */
#right{ position:relative; display:flex; flex-direction:column; background:var(--paper); }
#stageHead{ display:flex; align-items:center; gap:10px; padding:13px 20px 0; }
#vizTitle{ font-family:'Gochi Hand',cursive; font-size:16px; color:var(--ink2); flex:1;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#vizTag{ font-size:11.5px; color:var(--ink3); border:1px solid var(--line);
  border-radius:999px; padding:1px 9px; white-space:nowrap; }
#viz{ flex:1; position:relative; margin:9px 18px 0; border-radius:14px;
  border:1px solid var(--line); background:var(--paper); overflow:hidden; }
#viz svg{ width:100%; height:100%; display:block; }
#cap{ padding:7px 20px 0; font-size:13.5px; color:var(--ink2); min-height:18px; }
#hint{ padding:3px 20px 10px; font-size:12px; color:var(--ink3); }
#bar{ display:flex; align-items:center; gap:8px; padding:0 18px 13px; }
#bar button{ width:33px; height:33px; border-radius:50%; border:1px solid #c9c4b8;
  background:rgba(255,255,255,.8); color:#5a554b; font-size:13.5px; cursor:pointer; }
#bar button:hover{ background:#fff; color:var(--ink); }
#bar button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
#progress{ flex:1; height:5px; border-radius:3px; background:#e7e2d6; overflow:hidden; margin:0 6px; }
#progress i{ display:block; height:100%; width:0%; background:var(--accent); transition:width .3s; }
#badge{ font-size:11.5px; color:var(--ink3); border:1px solid var(--line); background:#fff;
  border-radius:999px; padding:2px 10px; white-space:nowrap; }
/* ---------- landing ---------- */
#landing{
  position:absolute; inset:0; z-index:8; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:15px; padding:0 7%;
  background:linear-gradient(150deg,#fff 0%,#faf9f5 45%,#f2f0ea 100%);
}
#landing h1{ margin:0; font-family:'Gochi Hand',cursive; font-weight:400;
  font-size:clamp(25px,3.3vw,48px); text-align:center; }
#landing .ask{ display:flex; align-items:flex-end; gap:14px; width:min(660px,86%); }
#qwrap{ position:relative; flex:1; }
#qi{ width:100%; font-family:'Patrick Hand',cursive; color:var(--ink); background:transparent;
  border:none; outline:none; padding:4px 2px 7px; font-size:clamp(16px,1.85vw,24px); }
#qi::placeholder{ color:#b6b0a4; }
#qwrap .uline{ position:absolute; left:-1%; right:-1%; bottom:-2px; height:8px; }
#go{ font-family:'Gochi Hand',cursive; color:#fff; cursor:pointer; background:var(--accent);
  border:none; border-radius:8px; font-size:clamp(14px,1.35vw,18px); padding:.45em 1.1em .5em;
  box-shadow:0 2px 5px rgba(20,80,40,.35); }
#go:hover{ background:#1c6a33; }
.tries{ font-size:13.5px; color:var(--ink3); text-align:center; }
.tries a{ color:var(--ink2); text-decoration:none; border-bottom:1.5px dotted var(--ink3);
  cursor:pointer; margin:0 .45em; }
.tries a:hover{ color:var(--ink); border-bottom-color:var(--ink); }
/* ---------- tooltip ---------- */
#tip{ position:fixed; z-index:60; pointer-events:none; opacity:0; transition:opacity .12s;
  background:#26241f; color:#fff; font-size:13px; padding:5px 9px; border-radius:7px;
  font-family:'Patrick Hand',cursive; white-space:nowrap; transform:translate(-50%,-135%); }
#tip.show{ opacity:.96; }
/* ---------- table ---------- */
.tblWrap{ width:100%; height:100%; overflow:auto; padding:8px 14px 16px; }
table.tbl{ width:100%; border-collapse:collapse; font-size:15px; }
table.tbl th{ text-align:left; font-family:'Gochi Hand',cursive; font-weight:400; font-size:15px;
  color:var(--ink2); border-bottom:2px solid var(--line); padding:7px 10px; cursor:pointer;
  user-select:none; position:sticky; top:0; background:var(--paper); }
table.tbl th:hover{ color:var(--ink); }
table.tbl th .arrow{ font-size:11px; color:var(--accent); margin-left:4px; }
table.tbl td{ padding:7px 10px; border-bottom:1px solid #eeebe2; }
table.tbl tbody tr{ cursor:pointer; }
table.tbl tbody tr:hover{ background:#f4f1e8; }
table.tbl tbody tr.sel{ background:#eef4ec; box-shadow:inset 3px 0 0 var(--accent); }
/* ---------- chart legend ---------- */
.legend{ position:absolute; top:8px; right:12px; display:flex; gap:10px; font-size:12.5px; }
.legend span{ cursor:pointer; display:flex; align-items:center; gap:5px; color:var(--ink2); }
.legend span.off{ opacity:.35; text-decoration:line-through; }
.legend i{ width:10px; height:10px; border-radius:2px; display:inline-block; }
/* ---------- modal ---------- */
#modal{ position:fixed; inset:0; background:rgba(40,36,28,.45); display:none;
  align-items:center; justify-content:center; z-index:70; }
#modal.open{ display:flex; }
#modal .box{ background:#fdfcf9; border-radius:14px; padding:24px 28px; width:min(92vw,440px);
  box-shadow:0 24px 60px rgba(0,0,0,.35); font-size:15px; }
#modal h2{ margin:0 0 4px; font-family:'Gochi Hand',cursive; font-weight:400; font-size:23px; }
#modal .hint2{ color:#8b8578; font-size:12.8px; margin:0 0 10px; line-height:1.5; }
#modal label{ display:block; margin:10px 0 3px; color:var(--ink2); font-size:13px; }
#modal input,#modal select{ width:100%; padding:7px 9px; border:1.5px solid #d3cec2;
  border-radius:7px; font-family:'Patrick Hand',cursive; font-size:14.5px; background:#fff; color:var(--ink); }
#apiState{ margin-top:8px; font-size:12.8px; color:var(--ink2); }
#modal .row{ display:flex; gap:10px; margin-top:16px; }
#modal .row button{ flex:1; padding:9px 0; border-radius:8px; border:1.5px solid #c9c4b8;
  background:#fff; color:#5a554b; font-family:'Patrick Hand',cursive; font-size:15px; cursor:pointer; }
#modal .row button.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
#toast{ position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#33312d;
  color:#fff; padding:8px 16px; border-radius:8px; font-size:13.5px; opacity:0; transition:opacity .3s;
  pointer-events:none; z-index:80; }
#toast.show{ opacity:.92; }
@media (max-width:980px){
  #app{ grid-template-columns:1fr; height:auto; min-height:96vh; }
  #left{ border-right:none; border-bottom:1px solid var(--line); }
  #viz{ min-height:320px; }
  #newQ{ position:static; display:inline-block; margin-top:18px; }
}
</style>
</head>
<body>
<div id="app">
  <div id="left">
    <div id="brand"><b>✎ Whiteboard Tutor</b><span>왼쪽 설명 · 오른쪽 인터랙티브</span></div>
    <h1 id="q">무엇이 궁금하세요?</h1>
    <p id="qsub"></p>
    <div id="steps"></div>
    <div id="newQ">＋ 새 질문</div>
  </div>

  <div id="right">
    <div id="stageHead">
      <div id="vizTitle">시각 자료</div>
      <div id="vizTag">—</div>
    </div>
    <div id="viz"></div>
    <div id="cap"></div>
    <div id="hint"></div>
    <div id="bar">
      <button id="bPause" title="일시정지/재생">⏸</button>
      <button id="bSkip" title="다음 단계">⏭</button>
      <button id="bReplay" title="다시 보기">↺</button>
      <button id="bCfg" title="설정">⚙</button>
      <div id="progress"><i></i></div>
      <div id="badge" hidden></div>
    </div>
  </div>

  <div id="landing">
    <h1>What do you want to understand?</h1>
    <div class="ask">
      <div id="qwrap">
        <input id="qi" autocomplete="off" spellcheck="false" placeholder="ask anything…">
        <svg class="uline" viewBox="0 0 520 8" preserveAspectRatio="none"><path d="M2 5 Q 90 2.5 180 4.4 T 360 4.2 T 518 4.6" fill="none" stroke="#33312d" stroke-width="2.6" stroke-linecap="round"/></svg>
      </div>
      <button id="go">Teach me →</button>
    </div>
    <div class="tries">or try
      <a data-q="계절은 왜 생겨?">계절은 왜 생겨?</a>
      <a data-q="백신은 어떻게 작동해?">백신은 어떻게 작동해?</a>
      <a data-q="미분이 뭐야?">미분이 뭐야?</a>
    </div>
  </div>
</div>

<div id="modal">
  <div class="box">
    <h2>설정</h2>
    <p class="hint2">이 페이지는 API 키를 갖지 않습니다. 키를 쥔 튜터 서버에 질문만 보냅니다.</p>
    <label>서버 주소</label>
    <input id="cApi" placeholder="http://127.0.0.1:8390">
    <label>엔진</label>
    <select id="cEngine">
      <option value="auto">자동 (로컬=deepseek · 외부=MOA)</option>
      <option value="deepseek">DeepSeek 단일 (가장 빠름)</option>
      <option value="moa">MOA (여러 모델 합성)</option>
    </select>
    <div id="apiState"></div>
    <div class="row">
      <button id="cCancel">닫기</button>
      <button id="cSave" class="primary">저장</button>
    </div>
  </div>
</div>
<div id="tip"></div>
<div id="toast"></div>

<script>
"use strict";
const NS="http://www.w3.org/2000/svg";
const $=id=>document.getElementById(id);
const COLORS={dark:"#33312d",red:"#cf4a3f",blue:"#3f62c9",green:"#3d9c54",gray:"#98917f",black:"#2e2c2a",ground:"#4a4740"};
const FILLS={pink:"rgba(224,124,112,.30)",blue:"rgba(110,140,220,.22)",green:"rgba(110,190,130,.22)"};
const PALS=["#3f62c9","#cf4a3f","#3d9c54","#c08a2e","#7a5bbd"];
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;

let SPEED=reduced?20:1;
let runId=0, paused=false, skipFlag=false, generating=false;
let lesson=null, lastQuery="";

/* ================= 서버 ================= */
const DEFAULT_API="http://127.0.0.1:8390";
function apiBase(){
  const qs=new URLSearchParams(location.search).get("api");
  if(qs) return qs.replace(/\/+$/,"");
  let saved="";
  try{ saved=(JSON.parse(localStorage.getItem("wbt-moa")||"{}").api)||""; }catch(e){}
  return (saved||DEFAULT_API).replace(/\/+$/,"");
}
function enginePref(){
  const qs=new URLSearchParams(location.search).get("engine");
  if(qs) return qs;
  try{ return (JSON.parse(localStorage.getItem("wbt-moa")||"{}").engine)||"auto"; }catch(e){ return "auto"; }
}
function engineFor(base){
  const p=enginePref();
  if(p&&p!=="auto") return p;
  try{
    const h=new URL(base).hostname;
    if(h==="127.0.0.1"||h==="localhost"||h==="::1") return "deepseek";
  }catch(e){}
  return "moa";
}
function setBadge(meta){
  const el=$("badge");
  if(!meta||!meta.answered||!meta.answered.length){ el.hidden=true; return; }
  const names=meta.answered.map(p=>meta.models&&meta.models[p]?meta.models[p].split("/").pop():p);
  el.hidden=false;
  el.textContent=(meta.backend==="single"?"엔진 ":"MOA ")+names.join(" + ")+
    (meta.ms?" · "+(meta.ms/1000).toFixed(1)+"s":"")+(meta.cached?" · 캐시":"");
}
async function fetchLesson(q){
  const base=apiBase();
  const ac=new AbortController();
  const t=setTimeout(()=>ac.abort(),180000);
  try{
    const r=await fetch(base+"/lesson",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({question:q,lang:"ko",engine:engineFor(base)}),signal:ac.signal});
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error||("HTTP "+r.status));
    if(!j.lesson||!j.lesson.steps) throw new Error("레슨 형식이 아닙니다");
    setBadge(j.meta||null);
    return j.lesson;
  }catch(e){
    if(e.name==="AbortError") throw new Error("응답 시간 초과 (3분)");
    if(String(e.message).includes("Failed to fetch")) throw new Error("서버("+base+")에 연결할 수 없습니다");
    throw e;
  }finally{ clearTimeout(t); }
}

/* ================= 타이밍 ================= */
function wait(ms,id){
  return new Promise(res=>{
    let left=ms/SPEED,last=performance.now();
    (function f(now){
      if(id!==runId||skipFlag) return res();
      if(!paused) left-=now-last;
      last=now;
      if(left<=0) res(); else requestAnimationFrame(f);
    })(performance.now());
  });
}
function typeText(node,str,cps,id){
  return new Promise(res=>{
    let i=0;
    (async function step(){
      for(i=1;i<=str.length;i++){
        if(id!==runId) break;
        node.textContent=str.slice(0,i);
        await wait(1000/cps,id);
        if(skipFlag) break;
      }
      node.textContent=str; res();
    })();
  });
}

/* ================= SVG 헬퍼 ================= */
function mk(tag,attrs,parent){
  const n=document.createElementNS(NS,tag);
  for(const k in attrs) if(attrs[k]!==undefined&&attrs[k]!==null) n.setAttribute(k,attrs[k]);
  (parent||$("viz")).appendChild(n);
  return n;
}
function arrowMarker(svg,color){
  let defs=svg.querySelector("defs");
  if(!defs) defs=mk("defs",{},svg);
  const id="arw"+color.replace(/[^a-z0-9]/gi,"");
  if(!defs.querySelector("#"+id)){
    const m=mk("marker",{id,viewBox:"0 0 10 10",refX:"8.5",refY:"5",markerWidth:"6.5",markerHeight:"6.5",orient:"auto-start-reverse"},defs);
    mk("path",{d:"M0 0 L10 5 L0 10 z",fill:color},m);
  }
  return "url(#"+id+")";
}
function drawStroke(node,dur,id,dashed){
  return new Promise(res=>{
    let len=300;
    try{ len=node.getTotalLength(); }catch(e){}
    if(dashed) node.style.opacity=0;
    else{ node.style.strokeDasharray=len+" "+len; node.style.strokeDashoffset=len; }
    dur=Math.max(90,(dur||Math.min(1400,Math.max(260,len*2.6)))/SPEED);
    let p=0,last=performance.now();
    (function f(now){
      if(id!==runId) return res();
      if(!paused){ p+=(now-last)/dur; last=now; } else { last=now; }
      if(skipFlag) p=1;
      if(dashed) node.style.opacity=Math.min(1,p*1.6);
      else node.style.strokeDashoffset=len*(1-Math.min(1,p));
      if(p>=1) res(); else requestAnimationFrame(f);
    })(performance.now());
  });
}

/* ================= 다이어그램 (레거시 els 호환) ================= */
async function renderDiagram(viz,host,id){
  const svg=mk("svg",{viewBox:"0 0 1200 640",preserveAspectRatio:"xMidYMid meet"},host);
  const els=(viz.els||[]);
  for(const e of els){
    if(id!==runId) return;
    if(e.k==="t"){
      const color=COLORS[e.c||"dark"]||e.c;
      const t=mk("text",{x:e.x,y:e.y,"font-size":e.s||26,fill:color,
        "font-family":e.f==="p"?"'Patrick Hand',cursive":"'Gochi Hand',cursive",
        "text-anchor":e.a||null},svg);
      t.style.cursor="default";
      t.addEventListener("mousemove",ev=>showTip(ev,t.textContent));
      t.addEventListener("mouseleave",hideTip);
      await typeText(t,e.t||"",e.cps||38,id);
      if(e.strike&&id===runId){
        const b=t.getBBox();
        const s=mk("line",{x1:b.x-4,y1:b.y+b.height*.58,x2:b.x+b.width+6,y2:b.y+b.height*.48,
          stroke:COLORS.red,"stroke-width":2.8,"stroke-linecap":"round"},svg);
        await drawStroke(s,400,id,false);
      }
      if(e.box&&id===runId){
        const b=t.getBBox(),pad=7;
        let n;
        if(e.box==="underline"){
          const y=b.y+b.height+3; let d="M "+(b.x-2)+" "+y;
          const seg=Math.max(24,b.width/6);
          for(let x=b.x-2+seg;x<b.x+b.width+2;x+=seg) d+=" q "+seg*.45+" 4.5 "+seg+" 1.2";
          n=mk("path",{d,fill:"none",stroke:COLORS[e.bc]||COLORS.green,"stroke-width":2.4,"stroke-linecap":"round"},svg);
        }else{
          n=mk("ellipse",{cx:b.x+b.width/2,cy:b.y+b.height/2+1,rx:b.width/2+pad,ry:b.height/2+pad-1,
            fill:"none",stroke:COLORS[e.bc]||COLORS.green,"stroke-width":2.3},svg);
        }
        await drawStroke(n,500,id,false);
      }
    }else if(e.k==="s"){
      const color=COLORS[e.c||"dark"]||e.c;
      const attrs={fill:"none",stroke:color,"stroke-width":e.w||2.6,"stroke-linecap":"round","stroke-linejoin":"round"};
      if(e.dash) attrs["stroke-dasharray"]=(e.w||2.6)*3+" "+(e.w||2.6)*3.2;
      if(e.arrow) attrs["marker-end"]=arrowMarker(svg,color);
      let node;
      if(e.shape==="ellipse"){
        node=mk("ellipse",{cx:e.cx,cy:e.cy,rx:e.rx,ry:e.ry,...attrs},svg);
        if(e.rot) node.setAttribute("transform","rotate("+e.rot+" "+e.cx+" "+e.cy+")");
      }else if(e.shape==="circle") node=mk("circle",{cx:e.cx,cy:e.cy,r:e.r,...attrs},svg);
      else if(e.shape==="line") node=mk("line",{x1:e.x1,y1:e.y1,x2:e.x2,y2:e.y2,...attrs},svg);
      else node=mk("path",{d:e.d,...attrs},svg);
      await drawStroke(node,e.dur,id,e.dash);
      if(e.fill&&FILLS[e.fill]&&id===runId){
        const fo=mk(e.shape==="ellipse"?"ellipse":e.shape==="circle"?"circle":"path",
          e.shape==="ellipse"?{cx:e.cx,cy:e.cy,rx:e.rx,ry:e.ry,fill:FILLS[e.fill],"fill-opacity":0,stroke:"none"}
          :e.shape==="circle"?{cx:e.cx,cy:e.cy,r:e.r,fill:FILLS[e.fill],"fill-opacity":0,stroke:"none"}
          :{d:e.d,fill:FILLS[e.fill],"fill-opacity":0,stroke:"none"},svg);
        node.parentNode.insertBefore(fo,node);
        fo.setAttribute("fill-opacity","1");
      }
    }
    await wait(e.after!=null?e.after:110,id);
  }
}

/* ================= 차트 ================= */
function fmt(v){
  if(!isFinite(v)) return "-";
  const a=Math.abs(v);
  if(a>=1000) return v.toLocaleString(undefined,{maximumFractionDigits:0});
  if(a>=10) return v.toFixed(1).replace(/\.0$/,"");
  return v.toFixed(2).replace(/\.?0+$/,"");
}
function renderChart(viz,host){
  const wrap=document.createElement("div");
  wrap.style.cssText="position:absolute;inset:0;";
  host.appendChild(wrap);
  const kind=viz.kind==="line"?"line":"bar";
  const labels=viz.labels||[];
  const series=(viz.series&&viz.series.length)?viz.series:[{name:"값",values:[]}];
  const all=series.flatMap(s=>(s.values||[])).filter(v=>typeof v==="number");
  const max=Math.max(...all,1)*1.15, min=Math.min(...all,0);
  // y축 눈금 폭에 맞춰 여백을 잡는다 (단위는 축 라벨에 한 번만 표기)
  const tickLen=Math.max(...[0,1,2,3,4].map(i=>fmt(min+(max-min)*i/4).length));
  const W=1000,H=560,padL=Math.max(64,26+tickLen*11),padR=28,padT=34,padB=60;
  const svg=mk("svg",{viewBox:"0 0 "+W+" "+H,preserveAspectRatio:"xMidYMid meet"},wrap);
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const yv=v=>padT+plotH-((v-min)/((max-min)||1))*plotH;
  for(let i=0;i<=4;i++){
    const val=min+(max-min)*i/4, yy=yv(val);
    mk("line",{x1:padL,y1:yy,x2:W-padR,y2:yy,stroke:"#e9e5da","stroke-width":1},svg);
    const t=mk("text",{x:padL-10,y:yy+5,"text-anchor":"end","font-size":17,fill:"#98917f",
      "font-family":"'Patrick Hand',cursive"},svg); t.textContent=fmt(val);
  }
  const n=labels.length||1, slot=plotW/n;
  labels.forEach((lb,i)=>{
    const t=mk("text",{x:padL+slot*(i+.5),y:H-padB+26,"text-anchor":"middle","font-size":16,
      fill:"#6e685c","font-family":"'Patrick Hand',cursive"},svg);
    t.textContent=lb;
  });
  mk("line",{x1:padL,y1:H-padB,x2:W-padR,y2:H-padB,stroke:"#cfc9ba","stroke-width":2},svg);
  if(viz.unit){
    const ut=mk("text",{x:padL-10,y:padT-14,"text-anchor":"end","font-size":14,fill:"#a29c90",
      "font-family":"'Patrick Hand',cursive"},svg);
    ut.textContent="("+viz.unit+")";
  }
  const groups={};
  series.forEach((s,si)=>{
    const color=s.color||PALS[si%PALS.length];
    const g=mk("g",{},svg); groups[s.name||si]=g;
    if(kind==="bar"){
      const bw=Math.min(56,(slot*0.7)/series.length||44);
      const offset=(si-(series.length-1)/2)*(bw+6);
      (s.values||[]).forEach((val,i)=>{
        const x=padL+slot*(i+.5)+offset-bw/2, yy=yv(val), h=Math.max(2,H-padB-yy);
        const r=mk("rect",{x,y:H-padB,width:bw,height:0,rx:4,fill:color,"fill-opacity":.88},g);
        r.style.transition="y .55s cubic-bezier(.2,.8,.3,1), height .55s cubic-bezier(.2,.8,.3,1)";
        r.style.cursor="pointer";
        const tipText=(s.name?s.name+": ":"")+fmt(val)+(viz.unit||"")+"  ("+(labels[i]||"")+")";
        r.addEventListener("mousemove",ev=>showTip(ev,tipText));
        r.addEventListener("mouseleave",hideTip);
        r.addEventListener("click",()=>r.setAttribute("fill-opacity",r.getAttribute("fill-opacity")==="1"?".55":"1"));
        requestAnimationFrame(()=>{ r.setAttribute("y",yy); r.setAttribute("height",h); });
      });
    }else{
      const pts=(s.values||[]).map((val,i)=>[padL+slot*(i+.5),yv(val)]);
      const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
      const path=mk("path",{d,fill:"none",stroke:color,"stroke-width":3.2,"stroke-linecap":"round","stroke-linejoin":"round"},g);
      let len=300; try{ len=path.getTotalLength(); }catch(e){}
      path.style.strokeDasharray=len; path.style.strokeDashoffset=len;
      path.style.transition="stroke-dashoffset .9s ease";
      requestAnimationFrame(()=>{ path.style.strokeDashoffset=0; });
      pts.forEach((p,i)=>{
        const c=mk("circle",{cx:p[0],cy:p[1],r:5.5,fill:"#fff",stroke:color,"stroke-width":2.6},g);
        c.style.cursor="pointer";
        const tipText=(s.name?s.name+": ":"")+fmt((s.values||[])[i])+(viz.unit||"")+"  ("+(labels[i]||"")+")";
        c.addEventListener("mousemove",ev=>showTip(ev,tipText));
        c.addEventListener("mouseleave",hideTip);
      });
    }
  });
  if(series.length>1){
    const lg=document.createElement("div");
    lg.className="legend";
    series.forEach((s,si)=>{
      const color=s.color||PALS[si%PALS.length];
      const sp=document.createElement("span");
      const dot=document.createElement("i"); dot.style.background=color;
      sp.appendChild(dot); sp.appendChild(document.createTextNode(s.name||("계열"+(si+1))));
      sp.addEventListener("click",()=>{
        sp.classList.toggle("off");
        groups[s.name||si].style.display=sp.classList.contains("off")?"none":"";
      });
      lg.appendChild(sp);
    });
    wrap.appendChild(lg);
  }
}

/* ================= 표 ================= */
function renderTable(viz,host){
  const wrap=document.createElement("div");
  wrap.className="tblWrap";
  const cols=viz.columns||[], rows=viz.rows||[];
  let sortCol=-1, sortDir=1;
  function build(){
    wrap.innerHTML="";
    const tb=document.createElement("table"); tb.className="tbl";
    const thead=document.createElement("thead"), trh=document.createElement("tr");
    cols.forEach((c,ci)=>{
      const th=document.createElement("th");
      th.appendChild(document.createTextNode(c));
      if(sortCol===ci){
        const a=document.createElement("span"); a.className="arrow";
        a.textContent=sortDir>0?"▲":"▼"; th.appendChild(a);
      }
      th.addEventListener("click",()=>{
        if(sortCol===ci) sortDir=-sortDir; else { sortCol=ci; sortDir=1; }
        build();
      });
      trh.appendChild(th);
    });
    thead.appendChild(trh); tb.appendChild(thead);
    const tb2=document.createElement("tbody");
    let data=rows.map(r=>r.slice());
    if(sortCol>=0){
      data.sort((a,b)=>{
        const x=a[sortCol],y=b[sortCol],nx=parseFloat(x),ny=parseFloat(y);
        if(!isNaN(nx)&&!isNaN(ny)) return (nx-ny)*sortDir;
        return String(x).localeCompare(String(y))*sortDir;
      });
    }
    data.forEach((r,ri)=>{
      const tr=document.createElement("tr");
      tr.style.opacity=0; tr.style.transition="opacity .3s";
      r.forEach(c=>{ const td=document.createElement("td"); td.textContent=c; tr.appendChild(td); });
      tr.addEventListener("click",()=>{
        [...tb2.children].forEach(x=>x.classList.remove("sel"));
        tr.classList.add("sel");
      });
      tr.addEventListener("mousemove",ev=>showTip(ev,cols[0]+": "+r[0]));
      tr.addEventListener("mouseleave",hideTip);
      tb2.appendChild(tr);
      setTimeout(()=>{ tr.style.opacity=1; },40*ri);
    });
    tb.appendChild(tb2); wrap.appendChild(tb);
  }
  build();
  host.appendChild(wrap);
}

/* ================= 그래프 (pan/zoom/crosshair) ================= */
function renderPlot(viz,host){
  const wrap=document.createElement("div");
  wrap.style.cssText="position:absolute;inset:0;";
  host.appendChild(wrap);
  const W=1000,H=560,padL=72,padR=26,padT=26,padB=56;
  const svg=mk("svg",{viewBox:"0 0 "+W+" "+H,preserveAspectRatio:"xMidYMid meet"},wrap);
  const curves=(viz.curves||[]).filter(c=>Array.isArray(c.points)&&c.points.length);
  if(!curves.length){
    const t=mk("text",{x:W/2,y:H/2,"text-anchor":"middle","font-size":22,fill:"#a29c90",
      "font-family":"'Gochi Hand',cursive"},svg);
    t.textContent="그래프 데이터가 없습니다";
    return;
  }
  const xs=curves.flatMap(c=>c.points.map(p=>p[0]));
  const ys=curves.flatMap(c=>c.points.map(p=>p[1]));
  let x0=viz.xRange?viz.xRange[0]:Math.min(...xs), x1=viz.xRange?viz.xRange[1]:Math.max(...xs);
  let y0=Math.min(...ys), y1=Math.max(...ys);
  const py=(y1-y0)*0.12||1; y0-=py; y1+=py;
  const grid=mk("g",{},svg), g=mk("g",{},svg);
  const crossX=mk("line",{stroke:"#bdb7a8","stroke-dasharray":"5 5","stroke-width":1.4,opacity:0},svg);
  const crossY=mk("line",{stroke:"#bdb7a8","stroke-dasharray":"5 5","stroke-width":1.4,opacity:0},svg);
  const dot=mk("circle",{r:5,fill:"#cf4a3f",opacity:0},svg);
  const read=mk("text",{"font-size":17,fill:"#33312d","font-family":"'Patrick Hand',cursive",opacity:0},svg);
  function draw(){
    const plotW=W-padL-padR, plotH=H-padT-padB;
    const px=x=>padL+((x-x0)/((x1-x0)||1))*plotW;
    const pyy=y=>padT+plotH-((y-y0)/((y1-y0)||1))*plotH;
    grid.innerHTML="";
    for(let i=0;i<=4;i++){
      const yy=padT+plotH*i/4, val=y1-(y1-y0)*i/4;
      mk("line",{x1:padL,y1:yy,x2:W-padR,y2:yy,stroke:"#e9e5da"},grid);
      const t1=mk("text",{x:padL-10,y:yy+5,"text-anchor":"end","font-size":17,fill:"#98917f",
        "font-family":"'Patrick Hand',cursive"},grid); t1.textContent=fmt(val);
      const xx=padL+plotW*i/4, xv=x0+(x1-x0)*i/4;
      mk("line",{x1:xx,y1:padT,x2:xx,y2:H-padB,stroke:"#f0ece2"},grid);
      const t2=mk("text",{x:xx,y:H-padB+26,"text-anchor":"middle","font-size":17,fill:"#98917f",
        "font-family":"'Patrick Hand',cursive"},grid); t2.textContent=fmt(xv);
    }
    mk("line",{x1:padL,y1:padT,x2:padL,y2:H-padB,stroke:"#cfc9ba","stroke-width":2},grid);
    if(0>=y0&&0<=y1) mk("line",{x1:padL,y1:pyy(0),x2:W-padR,y2:pyy(0),stroke:"#cfc9ba","stroke-width":2},grid);
    g.innerHTML="";
    curves.forEach((c,ci)=>{
      const color=c.color||PALS[ci%PALS.length];
      const d=c.points.map((p,i)=>(i?"L":"M")+px(p[0]).toFixed(1)+" "+pyy(p[1]).toFixed(1)).join(" ");
      const path=mk("path",{d,fill:"none",stroke:color,"stroke-width":3.2,"stroke-linecap":"round"},g);
      let len=6000; try{ len=path.getTotalLength(); }catch(e){}
      path.style.strokeDasharray=len; path.style.strokeDashoffset=len;
      path.style.transition="stroke-dashoffset .8s ease";
      requestAnimationFrame(()=>{ path.style.strokeDashoffset=0; });
      if(c.name){
        const t=mk("text",{x:padL+14,y:padT+22+ci*22,"font-size":17,fill:color,
          "font-family":"'Patrick Hand',cursive"},g); t.textContent=c.name;
      }
    });
    if(viz.xLabel){
      const t=mk("text",{x:W-padR,y:H-16,"text-anchor":"end","font-size":16,fill:"#6e685c",
        "font-family":"'Patrick Hand',cursive"},grid); t.textContent=viz.xLabel;
    }
    if(viz.yLabel){
      const t=mk("text",{x:padL-58,y:padT+4,"font-size":16,fill:"#6e685c",
        "font-family":"'Patrick Hand',cursive"},grid); t.textContent=viz.yLabel;
    }
  }
  draw();
  let dragging=false,lastX=0,lastY=0;
  svg.addEventListener("pointerdown",ev=>{ dragging=true; lastX=ev.clientX; lastY=ev.clientY; svg.style.cursor="grabbing"; });
  window.addEventListener("pointerup",()=>{ dragging=false; svg.style.cursor=""; });
  svg.addEventListener("pointermove",ev=>{
    const r=svg.getBoundingClientRect();
    if(dragging){
      const dx=(ev.clientX-lastX)/r.width*(x1-x0), dy=(ev.clientY-lastY)/r.height*(y1-y0);
      x0-=dx; x1-=dx; y0+=dy; y1+=dy;
      lastX=ev.clientX; lastY=ev.clientY; draw(); return;
    }
    const mx=(ev.clientX-r.left)/r.width*W, my=(ev.clientY-r.top)/r.height*H;
    if(mx<padL||mx>W-padR||my<padT||my>H-padB){
      crossX.setAttribute("opacity",0); crossY.setAttribute("opacity",0);
      dot.setAttribute("opacity",0); read.setAttribute("opacity",0); return;
    }
    const xv=x0+(mx-padL)/(W-padL-padR)*(x1-x0);
    let best=null;
    curves.forEach(c=>c.points.forEach(p=>{ if(!best||Math.abs(p[0]-xv)<Math.abs(best[0]-xv)) best=p; }));
    crossX.setAttribute("x1",mx); crossX.setAttribute("x2",mx);
    crossX.setAttribute("y1",padT); crossX.setAttribute("y2",H-padB); crossX.setAttribute("opacity",1);
    crossY.setAttribute("x1",padL); crossY.setAttribute("x2",W-padR);
    crossY.setAttribute("y1",my); crossY.setAttribute("y2",my); crossY.setAttribute("opacity",.55);
    if(best){
      const bxp=padL+((best[0]-x0)/((x1-x0)||1))*(W-padL-padR);
      const byp=padT+(H-padT-padB)-((best[1]-y0)/((y1-y0)||1))*(H-padT-padB);
      dot.setAttribute("cx",bxp); dot.setAttribute("cy",byp); dot.setAttribute("opacity",1);
      read.setAttribute("x",bxp+11); read.setAttribute("y",byp-12); read.setAttribute("opacity",1);
      read.textContent="("+fmt(best[0])+", "+fmt(best[1])+")";
    }
  });
  svg.addEventListener("mouseleave",()=>{
    crossX.setAttribute("opacity",0); crossY.setAttribute("opacity",0);
    dot.setAttribute("opacity",0); read.setAttribute("opacity",0);
  });
  svg.addEventListener("wheel",ev=>{
    ev.preventDefault();
    const f=ev.deltaY>0?1.12:0.89, cx=(x0+x1)/2, cy=(y0+y1)/2;
    x0=cx-(cx-x0)*f; x1=cx+(x1-cx)*f;
    y0=cy-(cy-y0)*f; y1=cy+(y1-cy)*f;
    draw();
  },{passive:false});
}

function renderImage(viz,host){
  const wrap=document.createElement("div");
  wrap.style.cssText="position:absolute;inset:0;overflow:hidden;cursor:grab;display:flex;align-items:center;justify-content:center;";
  const img=document.createElement("img");
  img.src=viz.src; img.alt=viz.alt||"";
  img.style.cssText="max-width:100%;max-height:100%;transform-origin:center center;transition:transform .12s ease;";
  img.addEventListener("error",()=>{ wrap.innerHTML='<div style="color:#a29c90;font-size:15px">이미지를 불러올 수 없습니다</div>'; });
  wrap.appendChild(img);
  let scale=1,tx=0,ty=0,drag=false,lx=0,ly=0;
  const apply=()=>{ img.style.transform="translate("+tx+"px,"+ty+"px) scale("+scale+")"; };
  wrap.addEventListener("wheel",ev=>{
    ev.preventDefault();
    scale=Math.min(5,Math.max(.5,scale*(ev.deltaY>0?0.9:1.1)));
    apply();
  },{passive:false});
  wrap.addEventListener("pointerdown",ev=>{ drag=true; lx=ev.clientX; ly=ev.clientY; wrap.style.cursor="grabbing"; });
  window.addEventListener("pointerup",()=>{ drag=false; wrap.style.cursor="grab"; });
  wrap.addEventListener("pointermove",ev=>{
    if(!drag) return;
    tx+=ev.clientX-lx; ty+=ev.clientY-ly; lx=ev.clientX; ly=ev.clientY; apply();
  });
  host.appendChild(wrap);
}

function normalize(raw){
  // v2: {title, text[], viz{}} / 레거시: {els[]} → diagram viz 로 변환
  const steps=(raw.steps||[]).map(s=>{
    if(Array.isArray(s.els)){
      const txt=s.els.filter(e=>e.k==="t").map(e=>e.t||"");
      const plain=txt.map(t=>t.replace(/^[!+]/,""));
      return {title:plain[0]||"", text:plain.slice(1), viz:{type:"diagram",els:s.els}};
    }
    return {
      title:s.title||"",
      text:Array.isArray(s.text)?s.text:(s.text?[String(s.text)]:[]),
      viz:s.viz||{type:"diagram",els:[]}
    };
  });
  return {topic:raw.topic||"", steps};
}

function addCard(step,i){

async function typeCard(card,step,id){
  [...card.querySelectorAll("p")].forEach(p=>p.remove());   // 같은 스텝 재렌더 시 중복 방지
  const jobs=[];
  (step.text||[]).forEach(line=>{
    if(!line){ jobs.push(Promise.resolve()); return; }
    const p=document.createElement("p");
    let cls="";
    if(line[0]==="!"){ cls="k"; line=line.slice(1); }
    else if(line[0]==="+"){ cls="g"; line=line.slice(1); }
    if(cls) p.className=cls;
    card.appendChild(p);
    jobs.push(typeText(p,line,32,id));
  });
  await Promise.all(jobs);
}
function setActive(i){
  const cards=[...$("steps").children];
  cards.forEach((c,ci)=>{

    c.classList.toggle("dim",ci>i);
  });
  if(cards[i]) cards[i].scrollIntoView({block:"nearest",behavior:"smooth"});

  diagram:"글자 위에 마우스를 올리면 값이 뜹니다",
  chart:"막대·점에 마우스를 올려 값 보기 · 오른쪽 범례를 누르면 계열 켜고 끄기",

  image:"휠 → 확대/축소 · 드래그 → 이동"
};
async function renderStep(i,id){
  const step=lesson.steps[i];
  setActive(i);
  let card=$("steps").querySelector('.card[data-i="'+i+'"]')||addCard(step,i);
  $("vizTitle").textContent=step.title||"";
  const type=(step.viz&&step.viz.type)||"diagram";
  $("vizTag").textContent=VIZ_LABEL[type]||"시각 자료";
  $("hint").textContent=VIZ_HINT[type]||"";
  $("cap").textContent=(step.viz&&step.viz.caption)||"";
  $("viz").innerHTML="";
  const host=document.createElement("div");
  host.style.cssText="position:absolute;inset:0;";
  $("viz").appendChild(host);
  const viz=step.viz||{type:"diagram"};
  const draw=(()=>{
    if(viz.type==="chart") return renderChart(viz,host);

    if(viz.type==="image") return renderImage(viz,host);

  })();

async function play(){
  if(!lesson) return;
  runId++; const id=runId;
  paused=false; skipFlag=false; $("bPause").textContent="⏸";
  clearStage();
  lesson.steps.forEach((s,i)=>addCard(s,i));
  [...$("steps").children].forEach(c=>c.classList.add("dim"));
  $("q").textContent=lesson.topic||lastQuery;
  $("qsub").textContent=lesson.steps.length+"단계 · 왼쪽 설명을 읽고 오른쪽 자료를 만져 보세요";
  for(let i=0;i<lesson.steps.length;i++){
    if(id!==runId) return;
    await renderStep(i,id);
    skipFlag=false;
    if(i<lesson.steps.length-1) await wait(850,id);
  }
  if(id===runId) $("vizTag").textContent="완료 · 단계를 눌러 되돌아보기";
}
function jump(i){
  if(!lesson) return;
  runId++;
  const id=runId;
  skipFlag=false;
  $("viz").innerHTML="";
  renderStep(i,id);
}

async function teach(q){
  if(!q||!q.trim()||generating) return;
  lastQuery=q.trim();
  $("landing").style.display="none";
  generating=true;
  const note=stageNote("그리는 중…");
  try{
    const raw=await fetchLesson(lastQuery);
    lesson=normalize(raw);
    if(!lesson.steps.length) throw new Error("단계가 비어 있습니다");
    generating=false; note.remove();
    play();
  }catch(e){
    generating=false; note.remove();
    stageNote("오류: "+(e.message||e));
  }
}

let toastT;
function toast(m){
  const el=$("toast"); el.textContent=m; el.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),2600);
}

function pickDemo(q){
  const s=(q||"").toLowerCase();
  if(/season|계절/.test(s)) return "seasons";
  if(/vaccine|백신|면역/.test(s)) return "vaccine";
  if(/derivative|미분|도함수/.test(s)) return "derivative";
  return null;
}
function demoLesson(name){
  const d=DEMOS[name];
  const steps=d.steps.map((s,i)=>{
    const note=(d.notes&&d.notes[i])||["",""];
    let title=note[0], text=note.slice(1);
    if(!title){                              // 노트가 모자라면 els 텍스트로 채운다
      const txt=s.els.filter(e=>e.k==="t").map(e=>e.t||"");
      title=txt[0]||"";
      text=txt.slice(1,4);
    }
    return {title, text, viz:{type:"diagram",els:s.els}};
  });
  return {topic:d.topic, steps};
}
const _teach=teach;
window.teach=function(q){
  const name=pickDemo(q);
  if(name){
    generating=false;
    lastQuery=(q||"").trim();
    $("landing").style.display="none";
    lesson=demoLesson(name);
    play();
    return;
  }
  return _teach(q);
};
